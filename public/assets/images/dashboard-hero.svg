<svg width="2000" height="1200" viewBox="0 0 2000 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#334155" stroke-width="0.5"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#grad1)" />
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.2" />
  
  <!-- Abstract Data Streams -->
  <g stroke="#3b82f6" stroke-width="2" opacity="0.6" filter="url(#glow)">
    <path d="M 0 800 Q 500 600 1000 800 T 2000 800" fill="none" />
    <path d="M 0 850 Q 500 650 1000 850 T 2000 850" fill="none" stroke-opacity="0.5" />
    <path d="M 0 900 Q 500 700 1000 900 T 2000 900" fill="none" stroke-opacity="0.3" />
  </g>

  <!-- Central Dashboard Elements -->
  <g transform="translate(1000, 600)" filter="url(#glow)">
    <circle cx="0" cy="0" r="150" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="10, 5">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.8">
       <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="15s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="80" fill="#1e293b" stroke="#3b82f6" stroke-width="2" opacity="0.9" />
    
    <!-- Pulse -->
    <circle cx="0" cy="0" r="50" fill="#3b82f6" opacity="0.2">
      <animate attributeName="r" from="50" to="70" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" from="0.2" to="0" dur="2s" repeatCount="indefinite" />
    </circle>

    <!-- Bar Charts -->
    <rect x="-200" y="100" width="20" height="60" fill="#3b82f6" opacity="0.8">
        <animate attributeName="height" values="60;100;40;80;60" dur="3s" repeatCount="indefinite" />
    </rect>
    <rect x="-170" y="80" width="20" height="80" fill="#06b6d4" opacity="0.8">
        <animate attributeName="height" values="80;50;90;30;80" dur="4s" repeatCount="indefinite" />
    </rect>
     <rect x="150" y="100" width="20" height="60" fill="#3b82f6" opacity="0.8">
        <animate attributeName="height" values="60;90;50;80;60" dur="3.5s" repeatCount="indefinite" />
    </rect>
    <rect x="180" y="70" width="20" height="90" fill="#06b6d4" opacity="0.8">
        <animate attributeName="height" values="90;40;80;50;90" dur="4.2s" repeatCount="indefinite" />
    </rect>
  </g>
  
  <!-- Overlay Content Space -->
  <rect x="0" y="0" width="2000" height="1200" fill="url(#grad1)" opacity="0.3" style="mix-blend-mode: overlay;" />
</svg>
